name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur
        run: npm install

      - name: Web dosyalarını www klasörüne kopyala
        run: |
          mkdir -p www
          cp index.html www/
          cp -r js www/js
          cp -r img www/img
          [ -f game.js ] && cp game.js www/ || true

      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx cap sync android

      - name: Uygulama simgesini yerleştir
        run: |
          cp -r assets/android-res/* android/app/src/main/res/
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.xml.bak

      - name: Sabit imza ve sürüm numarası
        run: |
          cp keystore/krallik.jks android/app/krallik.jks
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file("krallik.jks")\n            storePassword "krallik123"\n            keyAlias "krallik"\n            keyPassword "krallik123"\n        }\n    }/' android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode\|krallik" android/app/build.gradle

      - name: Ekranı yatay/dikey serbest bırak ve tam ekran yap
        run: |
          sed -i 's/android:theme="@style\/AppTheme.NoActionBarLaunch"/android:theme="@style\/AppTheme.NoActionBarLaunch"\n            android:screenOrientation="sensor"/' android/app/src/main/AndroidManifest.xml || true

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KrallikYolu-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
