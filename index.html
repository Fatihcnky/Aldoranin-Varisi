<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aldora'nın Mirası</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:#fff;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#top{position:absolute;top:0;left:0;right:0;padding:4px 8px;background:rgba(0,0,0,.68);font-size:13px;line-height:1.55;pointer-events:none}
#top span{margin-right:10px;white-space:nowrap}
#mm{position:absolute;right:6px;top:52px;border:2px solid #000b;width:110px;height:110px;background:#000;image-rendering:pixelated}
#log{position:absolute;left:6px;top:52px;max-width:58%;font-size:12px;pointer-events:none}
#log div{pointer-events:auto;background:rgba(0,0,0,.65);padding:3px 8px;margin-bottom:3px;border-radius:6px;animation:f 10s forwards}
@keyframes f{0%,85%{opacity:1}100%{opacity:0}}
#hint{position:absolute;left:0;right:0;bottom:56px;text-align:center;display:none}
#hint span{background:rgba(0,0,0,.75);padding:6px 10px;border-radius:8px;font-size:13px;margin-right:6px}
#selinfo{position:absolute;left:6px;bottom:56px;font-size:12px;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:6px;display:none;pointer-events:none}
#bar{position:absolute;bottom:0;left:0;right:0;display:flex;gap:4px;padding:5px;background:rgba(0,0,0,.8);overflow-x:auto}
button{background:#3b4a2f;color:#fff;border:1px solid #7a9a5a;border-radius:8px;padding:8px 10px;font-size:13px;white-space:nowrap;font-family:inherit}
button:active{background:#55703f}
button.dis{opacity:.4}
#panel{position:absolute;bottom:52px;left:0;right:0;max-height:52%;overflow:auto;background:rgba(15,20,12,.94);padding:6px 8px;display:none;border-top:2px solid #7a9a5a}
#panel .row{display:flex;gap:8px;align-items:center;margin:4px 0}
#panel .row small{opacity:.85;font-size:12px;line-height:1.3}
#panel h4{margin:6px 0 2px;font-size:14px}
.bar{height:6px;background:#333;border-radius:3px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:#7ac14a}
#menu,#diffscr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:12px;overflow:auto;z-index:30;background:radial-gradient(ellipse at 50% 30%,#2c3b1f,#0c120a)}
#diffscr{z-index:25;background:#0009}
#menu .mbox{text-align:center;max-width:380px;width:100%}
#menu h1{margin:0 0 2px;font-size:34px;color:#ffd88a;text-shadow:0 3px 0 #000}
.sub{margin:0 0 14px;color:#cdbb8a;font-size:13px}
.mb2{display:block;width:100%;margin:8px 0;padding:14px;font-size:17px;font-weight:700;border-radius:12px;background:#3d5a26;color:#fff;border:2px solid #c9a34a}
.mb2[disabled]{opacity:.4}
.mb2 small{display:block;font-weight:400;font-size:11px;color:#dde7c8}
#diffscr .box{background:#1d2616;border:2px solid #c9a34a;border-radius:12px;padding:12px;max-width:520px;width:100%;max-height:100%;overflow:auto}
#diffscr h3{margin:0 0 4px}
.dc{display:block;text-align:left;width:100%;margin:8px 0;padding:10px;border-radius:10px;background:#2a3a1c;border:2px solid #6b8a45;color:#fff}
.dc b{font-size:17px}.dc small{display:block;color:#cdbb8a;margin-bottom:4px}.dc div{font-size:12.5px;line-height:1.5}
.dc.k{border-color:#6fd16f}.dc.n{border-color:#c9a34a}.dc.z{border-color:#ff9a4a}.dc.e{border-color:#e04545}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{background:#1d2616;border:2px solid #7a9a5a;border-radius:12px;padding:14px;max-width:420px;width:100%}
#modal h3{margin:0 0 8px}
#modal p{margin:0 0 12px;font-size:14px;line-height:1.45}
#mbtn{display:flex;gap:8px;flex-wrap:wrap}

#top{padding:3px 6px;background:linear-gradient(#2a1e12ee,#1a120aee);border-bottom:2px solid #8a6a3a;font-size:13px}
#top .row1,#top .row2{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0}
.ri{height:1.15em;width:1.15em;vertical-align:-0.22em;image-rendering:pixelated}
.chip{position:relative;display:inline-flex;align-items:center;gap:3px;background:#0006;border:1px solid #6b5230;border-radius:12px;padding:1px 8px;font-size:13px;overflow:hidden;white-space:nowrap}
.chip b{font-weight:600}
.chip i{position:absolute;left:0;bottom:0;height:3px;background:#7ac14a}
.chip.full{border-color:#e6b422}.chip.full i{background:#e6b422}
.chip.wide{min-width:150px}.chip.warn{background:#5a4300;border-color:#e6b422}.chip.bad{background:#6a1a1a;border-color:#ff6b6b}
#quest{position:absolute;left:6px;top:60px;max-width:min(54%,360px);background:#2a1e12ec;border:1px solid #c9a34a;border-radius:10px;padding:5px 9px;font-size:12px;line-height:1.35;color:#ffe9b0;display:none;cursor:pointer}
#quest .qw{margin-top:3px;padding-top:3px;border-top:1px dashed #8a6a3a;color:#cfe8ff}
#log{top:130px;max-width:54%}
#top .chip{pointer-events:auto;cursor:pointer}
.flow{display:flex;flex-direction:column;gap:2px}.fr{display:grid;grid-template-columns:1.5fr .9fr .8fr .8fr .8fr 1.3fr;gap:4px;font-size:12px;background:#0006;border-radius:8px;padding:4px 6px;align-items:center}.fr.fh{background:none;color:#ffd88a;font-size:11px}
.fr .pos,.fr .ok{color:#9be59b}.fr .neg,.fr .bad{color:#ff9a9a}.fr .warn{color:#ffd070}
#setup{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:10px;z-index:20;overflow:auto}
#setup .box{background:#1d2616;border:2px solid #c9a34a;border-radius:12px;padding:12px;max-width:460px;width:100%;max-height:100%;overflow:auto}
#setup h3{margin:0 0 6px}#setup label{display:block;margin:8px 0 3px;font-size:12px;color:#ffd88a}
#setup input{width:100%;padding:9px;border-radius:8px;border:1px solid #8bb36a;background:#0d1308;color:#fff;font-size:15px;user-select:text;-webkit-user-select:text}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tg .tr{white-space:normal;text-align:left;padding:6px 8px}.tg .tr.on{background:linear-gradient(#6a4e22,#4a3416);border-color:#ffd070}
#tut{pointer-events:none;position:absolute;left:8px;right:8px;bottom:112px;background:#1d2a4cf2;border:2px solid #7aa7ff;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.4;display:none;z-index:5;max-width:560px;margin:0 auto}
#tut button{pointer-events:auto}
#tut .tb2{display:flex;gap:6px;align-items:center;margin-top:6px}
#selinfo{display:none!important}
#selbar{position:absolute;left:6px;bottom:62px;display:none;gap:5px;align-items:center;flex-wrap:wrap;z-index:4}
#selbar .sbn{background:#000a;border-radius:8px;padding:6px 8px;font-size:12px}
#selrect{position:absolute;border:2px dashed #7aff7a;background:#7aff7a22;display:none;pointer-events:none;z-index:3}
#bar{background:linear-gradient(#2a1e12,#150e07);border-top:2px solid #8a6a3a;gap:3px}
button{background:linear-gradient(#4a6a35,#34502a);border:1px solid #8bb36a;border-radius:9px;padding:8px 11px;font-weight:500;box-shadow:0 1px 0 #0006}
button.tb{display:flex;flex-direction:column;align-items:center;min-width:58px;padding:4px 7px;font-size:11px;background:linear-gradient(#3a2c1c,#2a1e12);border-color:#8a6a3a}
button.tb span{font-size:19px;line-height:1.1}button.tb.on{background:linear-gradient(#6a4e22,#4a3416);border-color:#ffd070}
#panel{background:linear-gradient(#1a2412f6,#0f160bf6);border-top:3px solid #c9a34a;border-radius:14px 14px 0 0;padding:8px 10px;max-height:56%}
#panel h4{color:#ffd88a;border-bottom:1px solid #5a4a2a;padding-bottom:2px;margin:10px 0 5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:6px}
.tcard,.jcard,.card{background:#0007;border:1px solid #5a6a44;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;font-size:12px}
.tcard .th,.jcard .th{display:flex;justify-content:space-between;gap:6px;font-size:13px}
.tcard.done{border-color:#7ac14a;background:#16300f}.tcard.avail{border-color:#ffd070;background:#2a2410}.tcard.busy{border-color:#7aa7ff;background:#102040}.tcard.lock,.jcard.lk{opacity:.5}
.tcard .rq{color:#c9b98a;font-size:11px}.tcard .cs{font-size:12px}
.agehd.lk{opacity:.5}.card.cur{margin:4px 0;flex-direction:row;align-items:center;gap:8px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.stat{background:#0007;border:1px solid #5a6a44;border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;min-width:64px;font-size:16px}
.stat small{font-size:10px;opacity:.8}.stat b{font-size:15px}
.jcard .pm{display:flex;gap:6px}.jcard .pm button{flex:1;padding:7px 0;font-size:16px}
.hh{display:flex;flex-wrap:wrap;gap:4px}.hc{background:#0007;border:1px solid #6b5230;border-radius:10px;padding:2px 8px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<!-- Ana Menü Butonları -->
<div id="game-menu" style="position:absolute;top:10px;left:10px;z-index:50;display:flex;gap:8px;flex-wrap:wrap;">
    <button class="button" onclick="openHelpPopup()">ℹ️ How to Play</button>
    <button class="button" onclick="openSaveMenu()">💾 Kaydet/Yükle</button>
    <button class="button small" onclick="quickSave()">⏺ Quick Save</button>
    <button class="button" onclick="openResearchMenu()">🔬 Teknoloji</button>
</div>
<canvas id="c"></canvas>
<div id="top"></div>
<canvas id="mm" width="120" height="120"></canvas>
<div id="quest" data-a="tab" data-v="quest"></div>
<div id="log"></div>
<div id="tut"></div>
<div id="selbar"></div>
<div id="selrect"></div>
<div id="hint"><span id="hinttxt"></span><span id="hintbtn"></span></div>
<div id="selinfo"></div>
<div id="panel"></div>
<div id="bar"></div>
<div id="setup"><div class="box"><h3>👑 Hükümdarını Oluştur</h3><label>Adın</label><input id="sName" maxlength="14" autocomplete="off"><label>Hane (soyadı)</label><input id="sHouse" maxlength="16" autocomplete="off"><label>Cinsiyet</label><div class="gl tg"></div><label>Özelliğin</label><div class="tl tg"></div><button data-a="setupgo" style="width:100%;margin-top:10px;font-size:16px">⚔ Yolculuğa Başla</button></div></div>
<div id="menu"><div class="mbox"><h1><img src="img/logo.png" style="width:150px;border-radius:18px;display:block;margin:0 auto 6px"></h1><p class="sub">Aldora'nın Son Varisi</p><div id="menuBtns"></div><small id="menuFoot"></small></div></div>
<div id="diffscr"><div class="box"><h3>⚔ Zorluk Seç</h3><p class="sub">Oynayacağın deneyimi seç. Bilgiler oyunun gerçek ayarlarıdır.</p><div id="diffList"></div><button class="mb2" data-a="diffback">← Geri</button></div></div>
<div id="modal"><div class="box"><h3 id="mt"></h3><p id="mb"></p><div id="mbtn"></div></div></div>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/units.js"></script>
<script src="js/sim.js"></script>
<script src="js/ai.js"></script>
<script src="js/dynasty.js"></script>
<script src="js/kingdoms.js"></script>
<script src="js/flow.js"></script>
<script src="js/render.js"></script>
<script src="js/sprites.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui2.js"></script>
<script src="js/audio.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/story.js"></script>
<script src="js/setup.js"></script>
<script src="js/menu.js"></script>
<script src="js/militia.js"></script>
<script src="js/food.js"></script>
<script src="js/testmode.js"></script>
<script src="js/input.js"></script>
<script src="js/saveSystem.js"></script>
<script src="js/buildingSystem.js"></script>
<script src="js/combatSystem.js"></script>
<script src="js/npcSystem.js"></script>
<script src="js/gameSystem.js"></script>
<script src="js/technologySystem.js"></script>
<script>
// How to Play popup
let helpPopup = null;
function openHelpPopup() {
    if (helpPopup) { helpPopup.parentNode.removeChild(helpPopup); helpPopup = null; return; }
    helpPopup = document.createElement("div");
    helpPopup.id = "help-popup";
    helpPopup.className = "modal-backdrop";
    helpPopup.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:1000;";
    const popupContent = document.createElement("div");
    popupContent.className = "modal-box";
    popupContent.style.cssText = "width:320px;max-height:450px;background:#1a2228;border:2px solid #457b9d;border-radius:8px;overflow:auto;";
    popupContent.innerHTML = `
        <div class="modal-header" style="padding:10px 15px;border-bottom:1px solid #457b9d;">
            <h3 style="margin:0;color:#e9ecef;">🎮 How to Play</h3>
            <span class="close-x" onclick="closeHelpPopup()" style="cursor:pointer;float:right;color:#aaa;">×</span>
        </div>
        <div class="modal-body" style="padding:15px;">
            <p><strong>🏗️ Bina Oluştur:</strong> Tıklayarak erişilebilen alanda "Build" butonuna basın</p>
            <p><strong>👥 Köylü Ata:</strong> Kaynakları tıklayıp "Assign Peasant" seçin</p>
            <p><strong>📦 Kaynak Yönetimi:</strong> Depo bınasını inşa ederek kapasitenizi artırın</p>
            <p><strong>🔬 Teknoloji Araştır:</strong> Menüden "Technology" sekmesine gidin</p>
            <p><strong>⏰ Sezon Döngüsü:</strong> Her 4. günde değişir: Yaz → Sonbahar → Kış → Bahar</p>
            <p><strong>⚔️ Savaş Hazırlığı:</strong> "Defense Tower" bina yapın</p>
            <p><strong>💾 Oyunu Kaydet:</strong> Menüden "Save/Load" ile 3 slotta kaydedebilirsiniz</p>
        </div>
    `;
    popupContent.onclick = function(e) { if (e.target === popupContent) closeHelpPopup(); };
    helpPopup.appendChild(popupContent);
    document.body.appendChild(helpPopup);
}
function closeHelpPopup() { if (helpPopup) { helpPopup.parentNode.removeChild(helpPopup); helpPopup = null; } }

// Quick save
function quickSave() { if(typeof saveToSlot === 'function') { saveToSlot(1); displayMessage("Hızlı kaydetildi! (Slot 1)", "success"); } else { displayMessage("Sistem yükleniyor...", "info"); } }

// Save menu
let saveMenuVisible = false;
function openSaveMenu() {
    const existingMenu = document.getElementById("save-menu");
    if (existingMenu) { existingMenu.parentNode.removeChild(existingMenu); saveMenuVisible = false; return; }
    saveMenuVisible = true;
    const saveMenu = document.createElement("div");
    saveMenu.id = "save-menu";
    saveMenu.style.cssText = "position:absolute;top:50px;left:10px;background:rgba(0,0,0,0.85);border:2px solid #457b9d;border-radius:8px;padding:15px;z-index:200;min-width:220px;";
    let html = "<h4>💾 Save Slots (3)</h4>";
    for (let i = 1; i <= 3; i++) {
        const saved = localStorage.getItem("aldora_save_" + i);
        const hasSave = saved !== null;
        html += `<div style="margin:8px 0;padding:5px;border-top:1px solid #333;border-bottom:1px solid #333;"><strong>Slot ${i}</strong> ${hasSave ? "(Kaydedilmiş)" : "(Boş)"}<br><button class="button tiny" onclick="loadFromSlot(${i})">Yükle</button><button class="button tiny" style="margin-left:5px;" onclick="saveToSlot(${i})">Kaydet</button></div>`;
    }
    html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid #333;"><button class="button" onclick="closeSaveMenu()">Kapat</button></div>`;
    saveMenu.innerHTML = html;
    document.body.appendChild(saveMenu);
}
function closeSaveMenu() { if (saveMenuVisible && document.getElementById("save-menu")) { document.getElementById("save-menu").parentNode.removeChild(document.getElementById("save-menu")); } saveMenuVisible = false; }

// Research menu
function openResearchMenu() {
    const panel = document.getElementById("panel");
    if (!panel) return;
    panel.style.display = "block";
    panel.innerHTML = "<h4>🔬 Teknoloji Araştırma</h4><div id=\"tech-list\"></div>";
    if(typeof displayAvailableTechnologies === 'function') displayAvailableTechnologies();
}

// Food list render
function renderFoodListUI() {
    const container = document.getElementById("food-list");
    if (!container || typeof FOOD_CONFIG === 'undefined') return;
    let html = "<div class='food-category'>🍛 Primary Foods</div>";
    FOOD_CONFIG.main.forEach(food => {
        html += `<div class="food-item" style="display:flex;justify-content:space-between;"><span>${food.icon} ${food.name}</span><span>${food.count > 0 ? food.count : "Stock"}</span></div>`;
    });
    html += "<div class='divider-small'></div>";
    html += "<div class='food-category'>🥕 Supplementary</div>";
    FOOD_CONFIG.supplementary.forEach(food => {
        html += `<div class="food-item" style="display:flex;justify-content:space-between;"><span>${food.icon} ${food.name}</span><span>${food.count > 0 ? food.count : "Stock"}</span></div>`;
    });
    container.innerHTML = html;
}

// Initialize on load
document.addEventListener("DOMContentLoaded", function() {
    // Add food list container
    const foodDiv = document.createElement("div");
    foodDiv.id = "food-list";
    foodDiv.style.cssText = "position:absolute;top:60px;left:10px;z-index:40;max-width:200px;";
    document.body.appendChild(foodDiv);
    if(typeof renderFoodListUI === 'function') setTimeout(renderFoodListUI, 500);
});
</script>
</body>
</html>
